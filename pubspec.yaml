  assets:
    - assets/icons/
    - assets/images/
    - assets/app_icon/


flutter_icons:
  android: true
  ios: true
  #image_path: "assets/app_icon/app_icon.png"
  image_path: "assets/app_icon/tidybayti_icon.png"
  adaptive_icon_background: "#D3E7F4"
  adaptive_icon_foreground: "assets/app_icon/tidybayti_icon.png"