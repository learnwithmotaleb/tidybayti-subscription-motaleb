  expandable_page_view: ^1.3.0
  font_awesome_flutter: ^11.0.0
  in_app_purchase: ^3.2.3
  google_fonts: ^8.2.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.2
  build_runner: ^2.4.6
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
