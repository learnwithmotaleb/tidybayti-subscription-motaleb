  cupertino_icons: ^1.0.8
  get: ^4.6.6
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  flutter_screenutil: ^5.9.3
  fluttertoast: ^8.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.1
  syncfusion_flutter_charts: 32.1.24
  calendar_date_picker2: ^1.1.7
  percent_indicator: ^4.2.3
  fpdart: ^1.1.1
  mime: ^2.0.0
  http: ^1.3.0
  get_it: ^8.0.3
  internet_connection_checker_plus: ^2.7.0
  logger: ^2.5.0
  image_picker: ^1.1.2
  typed_data: ^1.4.0
  jwt_decoder: ^2.0.1
  flutter_widget_from_html: ^0.16.0
  pdf: ^3.11.3
  printing: ^5.14.2
